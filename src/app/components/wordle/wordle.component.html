<!-- src/app/components/wordle/wordle.component.html -->
<div class="game-container">
  <h1>Wordle</h1>

  <div class="setup">
    <label>
      Mode de jeu:
      <select [(ngModel)]="selectedMode">
        <option *ngFor="let mode of gameModes" [value]="mode">{{ mode }}</option>
      </select>
    </label>
    <label>
      Longueur de mot:
      <select [(ngModel)]="selectedLength">
        <option [value]=5>5</option>
        <option [value]=6>6</option>
      </select>
    </label>
    <button (click)="startNewGame()">Nouvelle partie</button>
    <button (click)="resetGame()">Réinitialiser</button>
  </div>

  <!-- Timer display for Timed mode -->
  <div class="timer" *ngIf="selectedMode === 'Timed'">
    Temp restant: {{ timerValue }}s
  </div>

  <form (ngSubmit)="onGuess()" *ngIf="!gameEnded && (!selectedMode || selectedMode !== 'Timed' || timerValue > 0)">
    <input
      [(ngModel)]="currentGuess"
      name="guess"
      [maxlength]="selectedLength"
      required
      autocomplete="off"
      placeholder="Entre un mot de {{selectedLength}} lettres"
    />
    <button type="submit">Guess</button>
  </form>


  <p class="message">{{ message }}</p>
  <div *ngIf="gameEnded" class="score">Votre score: {{ score }}</div>

  <div class="guess-history">
    <div *ngFor="let row of history" class="guess-row">
      <span
        *ngFor="let letter of row.word.split(''); let i = index"
        class="tile"
        [ngClass]="row.feedback[i]"
      >
        {{ letter.toUpperCase() }}
      </span>
    </div>
  </div>

  <!-- Visual On-screen Keyboard -->
  <div class="keyboard">
    <div *ngFor="let row of keyboardRows" class="keyboard-row">
      <span *ngFor="let key of row" class="key" [ngClass]="keyboard[key]">{{ key }}</span>
    </div>
  </div>

  <div class="statistics">
    <h3>Statistiques:</h3>
    <p>Victoires: {{ wins }}</p>
    <p>Parties jouées: {{ gamesPlayed }}</p>
    <p>Tentatives moyennes: {{ averageAttempts | number:'1.1-1' }}</p>
  </div>
</div>
